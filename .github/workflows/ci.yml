name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Two majors rather than one pinned patch. The first version of this
        # workflow pinned 22.12 — the exact floor the engines field allowed —
        # and better-sqlite3's Linux prebuild segfaults on construction there.
        # A matrix of majors tracks what people actually install.
        node: [22, 24]

    name: check (node ${{ matrix.node }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run lint

      # The catalog tests assert the counts the README quotes, so a change to
      # either that is not matched in the other fails here rather than silently
      # leaving the documentation wrong.
      - run: npm test

      - run: npm run build
